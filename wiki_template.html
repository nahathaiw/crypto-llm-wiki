<title>Crypto Basics Wiki</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: left page index (sticky on desktop), right column of wiki pages; source tags link to raw notes */
:root{--bg:#EEF1F5;--card:#FFFFFF;--ink:#152233;--muted:#5A6878;--line:#D5DCE5;--accent:#2747A3;--hash:#A86A00;--soft:#E6ECF8;--warn:#9A3B1E;
--display:"Space Grotesk",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F1620;--card:#17212E;--ink:#E6ECF3;--muted:#9AA8B8;--line:#2A3746;--accent:#8FA8F5;--hash:#E3B04B;--soft:#1F2C40;--warn:#F0A07F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1620;--card:#17212E;--ink:#E6ECF3;--muted:#9AA8B8;--line:#2A3746;--accent:#8FA8F5;--hash:#E3B04B;--soft:#1F2C40;--warn:#F0A07F;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:240px 1fr;gap:28px}
.wrap>*{min-width:0}
@media (max-width:760px){.wrap{grid-template-columns:1fr}}
header{max-width:1100px;margin:0 auto 20px}
header h1{font:700 clamp(26px,4vw,40px)/1.1 var(--display);margin:0 0 6px}
header p{color:var(--muted);margin:0;max-width:70ch}
nav{position:sticky;top:max(16px,env(safe-area-inset-top,0px));align-self:start;display:grid;gap:4px;font-size:14px}
@media (max-width:760px){nav{position:static}}
nav a{color:var(--ink);text-decoration:none;padding:4px 8px;border-radius:4px} nav a:hover{background:var(--soft)}
main{display:grid;gap:18px}
article{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px 24px;scroll-margin-top:16px}
article h1{font:700 24px/1.2 var(--display);margin:0 0 10px;text-wrap:balance} article h2{font:500 17px var(--display);margin:18px 0 6px;color:var(--accent)}
.pid{font:12px var(--mono);color:var(--muted);margin:0 0 6px}
a{color:var(--accent)} a.st{font:600 11px var(--mono);background:var(--soft);padding:1px 5px;border-radius:3px;text-decoration:none;color:var(--hash)}
a.wl{font-family:var(--mono);font-size:13px}
.op{color:var(--warn);font-weight:600}
table{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.meta{display:grid;gap:2px;font-size:13px;color:var(--muted);margin-bottom:8px} .meta b{color:var(--ink);font-family:var(--mono);font-weight:600;font-size:12px;margin-right:6px}
#sources>h2{font:700 22px var(--display);margin:12px 0 0}
</style>
<header><h1>Crypto Basics Wiki</h1><p>An LLM-maintained wiki about blockchain and cryptocurrency for beginners. It has 10 concept pages built from 8 ingested sources. Each claim carries a source tag like <a class="st" href="#src-S1">S1</a>, and you can click the tag to see the raw note it came from.</p></header>
<div class="wrap"><nav>{{NAV}}</nav>
<main>{{PAGES}}<section id="sources"><h2>Raw sources</h2></section>{{SOURCES}}</main></div>
